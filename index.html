<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>karaoke-show-grace-New</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- ========================================================================= -->
    <!-- INTERCEPTADOR E CORRETOR DE REDE BLINDADO (PEGA OBJETOS DO TONE.JS)       -->
    <!-- ========================================================================= -->
    <script>
      (function() {
        const originalFetch = window.fetch;
        window.fetch = async function(...args) {
          if (args && args[0]) {
            let urlText = "";
            
            // Trata se o primeiro argumento for um objeto Request ou uma String pura
            if (typeof args[0] === 'object' && args[0].url) {
              urlText = String(args[0].url);
            } else if (typeof args[0] === 'string') {
              urlText = args[0];
            }

            // Se a URL contiver a falha do vevioz sem as barras da API correta
            if (urlText && urlText.includes("vevioz.com") && !urlText.includes("/api/button/mp3/")) {
              // Isola o videoId removendo os caracteres de domínio
              const videoId = urlText.split("vevioz.com").pop().replace(/[^a-zA-Z0-9_-]/g, "");
              
              if (videoId) {
                // CORREÇÃO DEFINITIVA: Injeta o subdomínio e as rotas oficiais usando concatenação pura
                const urlCorrigidaCompleta = "https://vevioz.com" + videoId;
                
                // Altera diretamente o argumento lido pelo Tone.js
                args[0] = urlCorrigidaCompleta;
                
                console.log("🛠️ Interceptador Blindado: URL corrigida com sucesso para ->", urlCorrigidaCompleta);
              }
            }
          }
          return originalFetch.apply(this, args);
        };
      })();
    </script>
  </body>
</html>
