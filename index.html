<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>karaoke-show-grace-New</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
      <!-- ========================================================================= -->
    <!-- INTERCEPTADOR GLOBAL DE REDE (RESOLUÇÃO DO INDICE DE REQUISIÇÃO)         -->
    <!-- ========================================================================= -->
    <script>
      (function() {
        const originalFetch = window.fetch;
        window.fetch = async function(...args) {
          // Captura a URL real contida obrigatoriamente na primeira posição do array de argumentos
          let urlInformada = args[0];
          
          if (urlInformada && typeof urlInformada === 'string') {
            // Se encontrar a string quebrada do cache sem as barras da API
            if (urlInformada.includes("vevioz.com") && !urlInformada.includes("/api/button/mp3/")) {
              // Isola o videoId removendo o domínio base
              const videoId = urlInformada.split("vevioz.com").pop().replace(/[^a-zA-Z0-9_-]/g, "");
              
              if (videoId) {
                // Reconstrói a URL oficial completa exigida pelo conversor
                const urlCorrigidaCompleta = "https://vevioz.com" + videoId;
                
                // INJEÇÃO NO ARRAY: Altera diretamente o primeiro argumento que o navegador vai disparar
                args[0] = urlCorrigidaCompleta;
                
                console.log("🛠️ Interceptador Global: URL corrigida com sucesso para ->", urlCorrigidaCompleta);
              }
            }
          }
          return originalFetch.apply(this, args);
        };
      })();
    </script>
  </body>
</html>
