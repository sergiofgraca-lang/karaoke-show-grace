<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>karaoke-show-grace-New</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
       <!-- ========================================================================= -->
    <!-- INTERCEPTADOR E CORRETOR DE REDE BLINDADO (PEGA OBJETOS DO TONE.JS)       -->
    <!-- ========================================================================= -->
    <script>
      (function() {
        const originalFetch = window.fetch;
        window.fetch = async function(...args) {
          // No JavaScript, o primeiro argumento do fetch (args[0]) pode ser uma String ou um Request Object
          if (args[0]) {
            let urlText = "";
            
            // Se for um objeto do Tone.js, extrai a propriedade url, se for string lê direto
            if (typeof args[0] === 'object' && args[0].url) {
              urlText = String(args[0].url);
            } else if (typeof args[0] === 'string') {
              urlText = args[0];
            }

            // Se a URL capturada contiver a falha do vevioz sem as barras da API
            if (urlText.includes("vevioz.com") && !urlText.includes("/api/button/mp3/")) {
              // Separa e limpa o videoId isolando os caracteres válidos do YouTube
              const videoId = urlText.split("vevioz.com").pop().replace(/[^a-zA-Z0-9_-]/g, "");
              
              if (videoId) {
                const urlCorrigidaCompleta = "https://vevioz.com" + videoId;
                
                // Sobrescreve o destino do fetch de forma cirúrgica na primeira posição do argumento
                args[0] = urlCorrigidaCompleta;
                
                console.log("🛠️ Interceptador Blindado: Objeto do Tone.js corrigido com sucesso para ->", urlCorrigidaCompleta);
              }
            }
          }
          return originalFetch.apply(this, args);
        };
      })();
    </script>
  </body>
</html>
